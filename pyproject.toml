[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "termind"
version = "1.0.0"
description = "Cross-platform, multi-provider autonomous AI engineering assistant for your terminal"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.51.0,<3.0.0",
    "openai>=1.40.0",
    "anthropic>=0.49.0",
    "rich>=13.7.0",
    "pyreadline3>=3.4.1; sys_platform == 'win32'",
    "mcp>=2.2.0,<3.0.0",
]

[project.scripts]
termind = "termind.cli:main"

[tool.setuptools.packages.find]
include = ["termind*"]
